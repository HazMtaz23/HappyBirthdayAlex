<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050403">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <!-- If she adds this page to her Home Screen it opens with zero Safari chrome at all -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Surprise">
  <title>A Little Birthday Secret</title>
  <meta name="description" content="A little birthday surprise, just for you.">
  <style>
    :root {
      color-scheme: dark;
      --ash: #050403;
      --soot: #0c0807;
      --ember: #ff6a2b;
      --ember-deep: #b8341a;
      --gold: #f2b765;
      --gold-deep: #c98a43;
      --bone: #efe6d6;
      --mute: #a39688;
      --line: rgba(242, 183, 101, .22);
      --display: "Bodoni 72", "Didot", "Bodoni MT", "Playfair Display", "Times New Roman", serif;
      --label: "Copperplate", "Copperplate Gothic Light", "Optima", "Gill Sans", "Trebuchet MS", sans-serif;
      --body: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--ash);
      color: var(--bone);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    body { position: fixed; inset: 0; width: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; border-radius: 4px; }

    /* ───────── Atmosphere ───────── */
    .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ash { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 45% at 50% 108%, rgba(184, 52, 26, .38), transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 38%, rgba(120, 36, 20, .22), transparent 70%);
      transition: opacity .6s ease;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 38%, rgba(0, 0, 0, .78) 100%);
    }
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .11; mix-blend-mode: screen;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
    }
    .flash {
      position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 40%, rgba(255, 150, 70, .85), rgba(255, 90, 30, .3) 42%, transparent 72%);
    }
    .flash.go { animation: flash .6s ease-out; }
    @keyframes flash { 0% { opacity: 0; } 22% { opacity: 1; } 100% { opacity: 0; } }

    /* ───────── Scenes ───────── */
    .app { position: fixed; inset: 0; z-index: 2; }
    .scene {
      position: absolute; inset: 0;
      display: grid; place-content: center; justify-items: center; align-content: center;
      gap: clamp(.9rem, 3.2dvh, 2rem);
      padding: max(1.25rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.25rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      text-align: center;
      opacity: 0; visibility: hidden;
      transform: scale(.985);
      transition: opacity .32s ease, transform .4s var(--ease), visibility 0s .32s;
    }
    .app[data-scene="sealed"] .sealed,
    .app[data-scene="rotate"] .rotate,
    .app[data-scene="gift"] .gift {
      opacity: 1; visibility: visible; transform: none;
      transition: opacity .34s ease .05s, transform .5s var(--ease) .05s, visibility 0s;
    }
    .copy { display: grid; justify-items: center; gap: clamp(.55rem, 1.8dvh, 1rem); max-width: 34rem; }

    /* ───────── Emblem ───────── */
    .emblem {
      position: relative; isolation: isolate;
      width: min(66vw, 34dvh, 320px); aspect-ratio: 1;
      filter: brightness(1) saturate(1);
      transition: filter .5s ease;
    }
    .emblem svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .emblem::before {
      content: ""; position: absolute; inset: 6%; z-index: -1; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 96, 40, .5), rgba(150, 40, 22, .32) 45%, transparent 72%);
      filter: blur(20px);
      transition: opacity .5s ease, transform .5s ease;
    }
    .emblem--dim { filter: brightness(.34) saturate(.55); }
    .emblem--dim::before { opacity: .35; }
    .emblem--dim.lit { filter: brightness(1.15) saturate(1.1); }
    .emblem--dim.lit::before { opacity: 1; transform: scale(1.15); }
    .ticks { transform-origin: 50% 50%; animation: turn 70s linear infinite; }
    .bird { filter: drop-shadow(0 0 14px rgba(247, 135, 57, .4)) drop-shadow(0 5px 7px #170805); }
    @keyframes turn { to { transform: rotate(360deg); } }

    /* ───────── Type ───────── */
    .title {
      margin: 0;
      font: 700 clamp(3rem, min(15.5vw, 9dvh), 6rem)/.95 var(--display);
      letter-spacing: -.025em;
      color: var(--bone);
      text-wrap: balance;
    }
    .title:focus-visible { outline: none; }
    .title .w { display: inline-block; white-space: nowrap; }
    .title .c {
      display: inline-block; opacity: 0;
      animation: letter 1s var(--ease) forwards;
      animation-delay: calc(var(--i) * 60ms + 200ms);
    }
    @keyframes letter {
      0%   { opacity: 0; filter: blur(9px); transform: translateY(.14em); text-shadow: none; }
      50%  { opacity: 1; filter: blur(0);   transform: none; text-shadow: 0 0 .45em rgba(255, 122, 50, .95); color: #ffe2bd; }
      100% { opacity: 1; filter: blur(0);   transform: none; text-shadow: 0 0 .7em rgba(255, 106, 43, .22); color: var(--bone); }
    }
    .line { margin: 0; text-wrap: balance; color: var(--mute); font: 400 clamp(1rem, 2.6dvh, 1.2rem)/1.5 var(--body); }
    .sealed .line, .sealed .cta { opacity: 0; animation: fade .8s ease forwards; }
    .sealed .line { animation-delay: 1.15s; }
    .sealed .cta { animation-delay: 1.45s; }
    @keyframes fade { to { opacity: 1; } }

    .cta {
      position: relative; margin-top: .4rem;
      display: inline-flex; align-items: center; gap: .9rem;
      min-height: 3.5rem; padding: .95rem 2rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 150, 80, .6);
      background: linear-gradient(180deg, rgba(255, 106, 43, .2), rgba(255, 106, 43, .05));
      color: var(--bone);
      font: 400 .86rem/1.2 var(--label);
      letter-spacing: .26em; text-transform: uppercase;
      box-shadow: 0 0 0 0 rgba(255, 106, 43, .5), inset 0 0 22px rgba(255, 106, 43, .1);
      transition: transform .18s ease, background .25s ease;
    }
    .sealed .cta.ready { opacity: 1; animation: breathe 2.8s ease-in-out infinite; }
    .cta:active { transform: scale(.96); }
    .cta svg { width: 1.1rem; height: 1.1rem; flex: none; }
    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 106, 43, .0), inset 0 0 22px rgba(255, 106, 43, .1); }
      50% { box-shadow: 0 0 34px 2px rgba(255, 106, 43, .38), inset 0 0 26px rgba(255, 106, 43, .2); }
    }
    .link {
      justify-self: center;
      min-height: 2.75rem; padding: .35rem .5rem;
      color: var(--gold); font: 400 .74rem/1.3 var(--label); letter-spacing: .2em; text-transform: uppercase;
      border-bottom: 1px solid var(--line);
    }

    /* ───────── Rotate scene ───────── */
    .turn { width: clamp(5.5rem, min(26vw, 20dvh), 9rem); color: var(--gold); overflow: visible; }
    .turn .phone { transform-origin: 64px 64px; animation: turn-phone 3.4s var(--ease) infinite; }
    .turn .arc { opacity: .55; }
    @keyframes turn-phone {
      0%, 22% { transform: rotate(0); }
      46%, 78% { transform: rotate(-90deg); }
      100% { transform: rotate(0); }
    }
    .rotate .title { font-size: clamp(2.2rem, min(10vw, 8dvh), 4.2rem); }

    /* ───────── Gift scene ───────── */
    .kicker { margin: 0; color: var(--gold); font: 400 clamp(.72rem, 1.9dvh, .85rem)/1.5 var(--label); letter-spacing: .26em; text-transform: uppercase; }
    .show {
      margin: 0; font-family: var(--display); font-weight: 700; text-transform: uppercase;
      font-size: clamp(2rem, min(10.6vw, 6.4dvh), 4.6rem); line-height: .98; letter-spacing: .02em;
      color: var(--bone);
      text-shadow: 0 0 .9em rgba(255, 106, 43, .3);
    }
    .show:focus-visible { outline: none; }
    .show span { display: block; white-space: nowrap; }
    .show em {
      display: block; margin-top: .22em;
      font: italic 400 .5em/1.1 var(--display); letter-spacing: .02em; text-transform: none; color: var(--gold);
      text-shadow: none;
    }
    .ticket {
      position: relative; overflow: hidden;
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      width: min(100%, 31rem); min-height: 5.6rem; text-align: left;
      color: #2a1710;
      background:
        repeating-linear-gradient(123deg, transparent 0 3px, rgba(111, 58, 38, .07) 3px 4px),
        linear-gradient(120deg, #f5d6a0, #d99f5c 58%, #b87b3d);
      border-radius: 3px;
      box-shadow: 0 14px 50px rgba(0, 0, 0, .75), 0 0 40px rgba(255, 106, 43, .14);
    }
    .ticket::before, .ticket::after {
      content: ""; position: absolute; right: 4.8rem; width: .8rem; height: .8rem; border-radius: 50%;
      background: #0a0605; transform: translateX(50%); z-index: 2;
    }
    .ticket::before { top: -.4rem; }
    .ticket::after { bottom: -.4rem; }
    .sheen {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%);
      transform: translateX(-120%);
    }
    .gift.play .sheen { animation: sheen 1.3s ease .95s both; }
    @keyframes sheen { to { transform: translateX(120%); } }
    .ticket-info { padding: .85rem 1rem; display: grid; gap: .1rem; align-content: center; }
    .ticket-label, .ticket-city, .stub span { display: block; font: 400 .66rem/1.4 var(--label); letter-spacing: .18em; text-transform: uppercase; opacity: .82; }
    .ticket-venue { display: block; font: 700 clamp(1.02rem, 2.4dvh, 1.3rem)/1.15 var(--display); }
    .stub { width: 4.8rem; display: grid; place-content: center; gap: .1rem; text-align: center; border-left: 1px dashed rgba(90, 52, 30, .5); }
    .stub strong { font: 400 1.9rem/1 var(--display); }

    .gift .emblem::before { opacity: 1; }
    .gift.play .bird { animation: ignite 1.1s var(--ease) both; transform-origin: center; }
    .gift.play .emblem { animation: emblem-in .9s var(--ease) both; }
    .gift.play .copy > * { animation: rise .7s var(--ease) both; }
    .gift.play .copy > :nth-child(1) { animation-delay: .25s; }
    .gift.play .copy > :nth-child(2) { animation-delay: .38s; }
    .gift.play .copy > :nth-child(3) { animation-delay: .52s; }
    .gift.play .copy > :nth-child(4) { animation-delay: .68s; }
    .gift.play .copy > :nth-child(5) { animation-delay: .95s; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    @keyframes emblem-in { from { opacity: 0; transform: scale(.9); } }
    @keyframes ignite {
      0% { transform: scale(.92); filter: drop-shadow(0 0 0 transparent); }
      30% { transform: scale(1.07); filter: drop-shadow(0 0 30px #ffb559); }
      100% { transform: scale(1); }
    }

    /* ───────── Cinema ───────── */
    .cinema {
      position: fixed; inset: 0; z-index: 40; background: #000;
      opacity: 0; transition: opacity .3s ease;
      touch-action: manipulation;
    }
    .cinema.on { opacity: 1; }
    .cinema:fullscreen { width: 100%; height: 100%; }
    .cinema video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #000; display: block;
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    }
    /* Orientation lock on? Turn the picture sideways so she just tilts the phone. */
    .cinema.is-sideways {
      inset: auto; top: 0; left: 0;
      width: 100dvh; height: 100vw;
      transform-origin: 0 0; transform: rotate(90deg) translateY(-100%);
    }
    .cinema.is-sideways video { padding: 0; }

    .hud {
      position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; pointer-events: none;
      padding: max(.7rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(.7rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: linear-gradient(to bottom, rgba(0, 0, 0, .6), transparent 24%, transparent 64%, rgba(0, 0, 0, .78));
      opacity: 0; transition: opacity .3s ease;
    }
    .cinema.is-sideways .hud { padding: .8rem 1.2rem; }
    .cinema.hud-on .hud { opacity: 1; }
    .hud button, .scrub { pointer-events: auto; }
    .hud-top { display: flex; justify-content: flex-end; }
    .skip {
      min-height: 2.5rem; padding: .4rem 1.1rem; border-radius: 999px;
      border: 1px solid rgba(239, 230, 214, .3); background: rgba(0, 0, 0, .35);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font: 400 .7rem/1 var(--label); letter-spacing: .22em; text-transform: uppercase; color: var(--bone);
    }
    .hint {
      align-self: end; justify-self: center; margin-bottom: 1rem; pointer-events: none;
      padding: .7rem 1.3rem; border-radius: 999px;
      border: 1px solid rgba(255, 150, 80, .6); background: rgba(10, 5, 3, .72);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font: 400 .72rem/1 var(--label); letter-spacing: .22em; text-transform: uppercase; color: var(--bone);
      opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .3s ease;
    }
    .cinema.has-hint .hint { opacity: 1; transform: none; animation: breathe 2.4s ease-in-out infinite; }
    .cinema.has-hint .hud { opacity: 1; }
    .bar { display: flex; align-items: center; gap: .9rem; }
    .ctl { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; color: var(--bone); flex: none; }
    .ctl svg { width: 1.45rem; height: 1.45rem; }
    .ico-play { display: none; }
    .cinema.is-paused .ico-play { display: block; }
    .cinema.is-paused .ico-pause { display: none; }
    .time { font: 400 .74rem/1 var(--label); letter-spacing: .1em; color: var(--mute); min-width: 2.6rem; font-variant-numeric: tabular-nums; }
    .scrub { position: relative; flex: 1; height: 2.75rem; touch-action: none; cursor: pointer; }
    .scrub::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px; background: rgba(239, 230, 214, .22); }
    .scrub i { position: absolute; left: 0; top: 50%; height: 3px; margin-top: -1.5px; width: 100%; border-radius: 2px; transform-origin: 0 50%; transform: scaleX(var(--p, 0)); background: linear-gradient(90deg, var(--ember), var(--gold)); }
    .scrub b { position: absolute; top: 50%; left: calc(var(--p, 0) * 100%); width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--ember); }
    .no-fs .fs-btn { display: none; }
    .cinema.is-sideways .fs-btn { display: none; }

    /* ───────── Landscape: side by side ───────── */
    @media (orientation: landscape) and (min-aspect-ratio: 11/10) {
      .scene.sealed, .scene.gift { grid-auto-flow: column; grid-template-columns: auto auto; column-gap: clamp(1.5rem, 7vw, 5rem); text-align: left; }
      .scene.sealed .copy, .scene.gift .copy { justify-items: start; }
      .scene.gift .link { justify-self: start; padding-left: 0; }
      .scene .emblem { width: min(58dvh, 34vw, 420px); }
      .sealed .title { font-size: clamp(2.6rem, 13dvh, 6rem); }
      .show { font-size: clamp(1.9rem, 9.5dvh, 4.2rem); }
      .scene.rotate { grid-auto-flow: row; }
      .copy { max-width: 30rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .gift .copy { gap: .35rem; }
      .ticket { min-height: 4.6rem; }
      .ticket-info { padding: .6rem .9rem; }
      .link { min-height: 2rem; padding-block: .1rem; }
    }
    @media (max-width: 360px) {
      .cta { padding-inline: 1.5rem; letter-spacing: .2em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
      .title .c { opacity: 1; }
    }
  </style>
</head>
<body>
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
            <linearGradient id="metal" x1="130" y1="80" x2="377" y2="400" gradientUnits="userSpaceOnUse">
              <stop stop-color="#fff1bb"/>
              <stop offset=".26" stop-color="#e9ad5d"/>
              <stop offset=".48" stop-color="#ffda8d"/>
              <stop offset=".72" stop-color="#ae5c31"/>
              <stop offset="1" stop-color="#f8bf6e"/>
            </linearGradient>
            <linearGradient id="rim" x1="98" y1="104" x2="386" y2="400" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffd895"/>
              <stop offset=".45" stop-color="#8c4028"/>
              <stop offset=".7" stop-color="#f5ae60"/>
              <stop offset="1" stop-color="#9f522d"/>
            </linearGradient>
            <radialGradient id="seal">
              <stop stop-color="#57221d"/>
              <stop offset="1" stop-color="#1b1012"/>
            </radialGradient>
          </defs>
  </svg>

  <canvas class="ash" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="flash" aria-hidden="true"></div>

  <main class="app" data-scene="sealed">

    <!-- 1 · Sealed -->
    <section class="scene sealed" data-name="sealed" aria-labelledby="t-sealed">
      <div class="emblem emblem--dim" data-emblem-sealed aria-hidden="true">
        <svg viewBox="0 0 500 500" fill="none">
          
          <circle cx="250" cy="250" r="208" stroke="#d98c5861"/>
          <circle class="ticks" cx="250" cy="250" r="195" stroke="#d98c5890" stroke-width="4" stroke-dasharray="1 9.21"/>
          <circle cx="250" cy="250" r="176" stroke="#d98c5845"/>
          <path d="M250 32v22m0 392v22M32 250h22m392 0h22M100 100l12 12m276 276 12 12m0-300-12 12M112 388l-12 12" stroke="#d58b58"/>
          <path d="m250 31 4 7-4 7-4-7Zm212 212 4 7-4 7-4-7ZM250 455l4 7-4 7-4-7ZM38 243l4 7-4 7-4-7Z" fill="#edb776"/>
          <circle cx="250" cy="250" r="149" fill="url(#seal)" stroke="url(#rim)" stroke-width="7"/>
          <circle cx="250" cy="250" r="140" stroke="#e9a55c8c"/>
          <circle cx="250" cy="250" r="154" stroke="#f4b66a48"/>
          <g class="bird" fill="url(#metal)">
            <!-- The arrow crosses behind the silhouette. -->
            <path d="m112 308 255-121 3 5-255 121z"/>
            <path d="m361 192-12-8 32-4-22 23zM127 303l-17-5-17 8 17 5zm8 2-5 16-17 8 5-16z"/>
            <path d="M222 257c-20-22-34-45-44-68-13-29-16-55-10-80 13 23 30 44 55 59l-20-33c25 20 47 41 59 73 7-6 13-17 20-26 8-11 21-15 34-11l18 8-19 4c-7 0-12 5-17 15-6 13-8 30-16 42-13 22-36 34-66 39l-25 27 12-28-38 15 20-24-33 1 40-20z"/>
            <path d="M269 225c22-18 46-37 60-62 11-18 15-36 15-56 12 16 15 37 8 59 9-7 19-18 25-30-4 35-24 58-46 72 13-2 23-8 32-14-18 24-47 39-83 45z"/>
          </g>
          <g stroke="#642918" stroke-width="2" stroke-linecap="round" opacity=".76">
            <path d="M179 141c4 42 31 74 58 91m-46-56c9 22 22 33 38 45m-30-14c10 15 21 23 34 28m111-97c-7 38-25 56-47 73m55-37c-10 17-24 30-43 42m-98 43c21 3 41-2 51-12"/>
          </g>
          <circle cx="311" cy="177" r="1.8" fill="#6e2b20"/>
          <path d="M232 343h36m-29 7h22m-16 7h10" stroke="#e4a865" stroke-linecap="round" opacity=".75"/>
        </svg>
      </div>
      <div class="copy">
        <h1 class="title" id="t-sealed" tabindex="-1" data-split>Happy Birthday</h1>
        <p class="line">There’s one more thing to open.</p>
        <noscript><p class="line">Enable JavaScript to open your surprise.</p></noscript>
        <button class="cta" type="button" data-action="open" hidden>
          <span>Open your surprise</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <!-- 2 · Rotate -->
    <section class="scene rotate" data-name="rotate" aria-labelledby="t-rotate" inert>
      <svg class="turn" viewBox="0 0 128 128" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="64" cy="64" r="59" opacity=".25" stroke-dasharray="1 5"/>
        <path class="arc" d="M22 46a45 45 0 0 1 68-19m-2-10 4 12-12 3M106 82a45 45 0 0 1-68 19m2 10-4-12 12-3" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="phone">
          <rect x="45" y="30" width="38" height="68" rx="7" fill="#150d0a"/>
          <path d="M59 38h10" stroke-linecap="round"/>
          <path d="m60 56 12 8-12 8z" fill="currentColor" stroke="none"/>
        </g>
      </svg>
      <div class="copy">
        <h1 class="title" id="t-rotate" tabindex="-1">Rotate your phone</h1>
        <p class="line">Turn it sideways to begin.</p>
        <button class="link" type="button" data-action="sideways">Rotation locked? Watch sideways</button>
      </div>
    </section>

    <!-- 3 · The gift -->
    <section class="scene gift" data-name="gift" aria-labelledby="t-gift" inert>
      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 500 500" fill="none">
          
          <circle cx="250" cy="250" r="208" stroke="#d98c5861"/>
          <circle class="ticks" cx="250" cy="250" r="195" stroke="#d98c5890" stroke-width="4" stroke-dasharray="1 9.21"/>
          <circle cx="250" cy="250" r="176" stroke="#d98c5845"/>
          <path d="M250 32v22m0 392v22M32 250h22m392 0h22M100 100l12 12m276 276 12 12m0-300-12 12M112 388l-12 12" stroke="#d58b58"/>
          <path d="m250 31 4 7-4 7-4-7Zm212 212 4 7-4 7-4-7ZM250 455l4 7-4 7-4-7ZM38 243l4 7-4 7-4-7Z" fill="#edb776"/>
          <circle cx="250" cy="250" r="149" fill="url(#seal)" stroke="url(#rim)" stroke-width="7"/>
          <circle cx="250" cy="250" r="140" stroke="#e9a55c8c"/>
          <circle cx="250" cy="250" r="154" stroke="#f4b66a48"/>
          <g class="bird" fill="url(#metal)">
            <!-- The arrow crosses behind the silhouette. -->
            <path d="m112 308 255-121 3 5-255 121z"/>
            <path d="m361 192-12-8 32-4-22 23zM127 303l-17-5-17 8 17 5zm8 2-5 16-17 8 5-16z"/>
            <path d="M222 257c-20-22-34-45-44-68-13-29-16-55-10-80 13 23 30 44 55 59l-20-33c25 20 47 41 59 73 7-6 13-17 20-26 8-11 21-15 34-11l18 8-19 4c-7 0-12 5-17 15-6 13-8 30-16 42-13 22-36 34-66 39l-25 27 12-28-38 15 20-24-33 1 40-20z"/>
            <path d="M269 225c22-18 46-37 60-62 11-18 15-36 15-56 12 16 15 37 8 59 9-7 19-18 25-30-4 35-24 58-46 72 13-2 23-8 32-14-18 24-47 39-83 45z"/>
          </g>
          <g stroke="#642918" stroke-width="2" stroke-linecap="round" opacity=".76">
            <path d="M179 141c4 42 31 74 58 91m-46-56c9 22 22 33 38 45m-30-14c10 15 21 23 34 28m111-97c-7 38-25 56-47 73m55-37c-10 17-24 30-43 42m-98 43c21 3 41-2 51-12"/>
          </g>
          <circle cx="311" cy="177" r="1.8" fill="#6e2b20"/>
          <path d="M232 343h36m-29 7h22m-16 7h10" stroke="#e4a865" stroke-linecap="round" opacity=".75"/>
        </svg>
      </div>
      <div class="copy">
        <p class="kicker">Surprise. We’re going to see</p>
        <h1 class="show" id="t-gift" tabindex="-1"><span>The Hunger</span><span>Games</span><em>On Stage</em></h1>
        <p class="line">Two seats for a night at the theatre in London.</p>
        <div class="ticket">
          <i class="sheen"></i>
          <div class="ticket-info">
            <span class="ticket-label">Birthday night out</span>
            <strong class="ticket-venue">Troubadour Canary Wharf Theatre</strong>
            <span class="ticket-city">London</span>
          </div>
          <div class="stub"><strong>02</strong><span>Guests</span></div>
        </div>
        <button class="link" type="button" data-action="replay">Watch the trailer again</button>
      </div>
    </section>
  </main>

  <!-- Cinema: sits above everything, black, edge to edge -->
  <div class="cinema" hidden>
    <video playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback" src="trailer.mp4" aria-label="Trailer"></video>
    <div class="hud">
      <div class="hud-top"><button class="skip" type="button" data-action="skip">Skip</button></div>
      <div class="hint" role="status"><span></span></div>
      <div class="bar">
        <button class="ctl" type="button" data-action="toggle" aria-label="Play or pause">
          <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        </button>
        <span class="time" data-now>0:00</span>
        <div class="scrub" role="slider" aria-label="Seek" tabindex="0"><i></i><b></b></div>
        <span class="time" data-left>0:00</span>
        <button class="ctl fs-btn" type="button" data-action="fullscreen" aria-label="Full screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';
    const $ = (s, r = document) => r.querySelector(s);
    const app = $('.app');
    const scenes = [...document.querySelectorAll('.scene')];
    const cinema = $('.cinema');
    const video = $('.cinema video');
    const flashEl = $('.flash');
    const hintText = $('.hint span');
    const scrub = $('.scrub');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const landscapeQuery = matchMedia('(orientation: landscape)');
    const touchDevice = matchMedia('(pointer: coarse)');

    let state = 'sealed';          // sealed | rotate | cinema | gift
    let sideways = false;          // picture turned 90° for people with rotation lock on
    let runId = 0;
    let hudTimer = 0;
    let orientTimer = 0;
    let fsPrompted = false;

    const isLandscape = () => landscapeQuery.matches;
    const needsRotate = () => touchDevice.matches && !isLandscape();   // desktop never gets the rotate prompt

    /* ───────── Falling ash + rising embers ───────── */
    const ash = (() => {
      const canvas = $('.ash'); const ctx = canvas.getContext('2d');
      let w = 0, h = 0, dpr = 1, parts = [], raf = 0, last = 0, emberRatio = .12;
      const rand = (a, b) => a + Math.random() * (b - a);
      function spawn(initial) {
        const ember = Math.random() < emberRatio;
        return {
          ember,
          x: rand(0, w),
          y: initial ? rand(0, h) : (ember ? h + 12 : -12),
          r: ember ? rand(.7, 1.7) : rand(.6, 2),
          vy: ember ? -rand(14, 40) : rand(7, 22),
          vx: rand(-5, 10),
          ph: rand(0, 6.28),
          a: ember ? rand(.5, .95) : rand(.12, .42)
        };
      }
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        parts = Array.from({ length: Math.round(Math.min(70, Math.max(28, w * h / 9000))) }, () => spawn(true));
      }
      function frame(t) {
        raf = requestAnimationFrame(frame);
        const dt = Math.min((t - last) / 1000 || .016, .05); last = t;
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          p.ph += dt * .9;
          p.x += (p.vx + Math.sin(p.ph) * 9) * dt;
          p.y += p.vy * dt;
          if (p.y > h + 14 || p.y < -14 || p.x > w + 14 || p.x < -14) { parts[i] = spawn(false); continue; }
          if (p.ember) {
            const flick = .65 + Math.sin(p.ph * 3) * .35;
            ctx.fillStyle = `rgba(255,110,40,${.14 * p.a * flick})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4.2, 0, 6.283); ctx.fill();
            ctx.fillStyle = `rgba(255,170,100,${p.a * flick})`;
          } else {
            ctx.fillStyle = `rgba(205,195,185,${p.a})`;
          }
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
        }
      }
      return {
        init() { resize(); addEventListener('resize', () => { clearTimeout(ash._t); ash._t = setTimeout(resize, 200); }); },
        start() { if (reduceMotion || raf) return; last = performance.now(); raf = requestAnimationFrame(frame); },
        stop() { cancelAnimationFrame(raf); raf = 0; },
        mood(m) { emberRatio = m === 'gift' ? .5 : .12; }
      };
    })();

    /* ───────── Scenes ───────── */
    function setScene(name) {
      state = name;
      app.dataset.scene = name;
      scenes.forEach(s => { s.inert = s.dataset.name !== name; });
      ash.mood(name);
      if (name === 'cinema') ash.stop(); else if (!document.hidden) ash.start();
      if (name === 'gift') {
        const g = $('.gift'); g.classList.remove('play'); void g.offsetWidth; g.classList.add('play');
      }
      if (name !== 'cinema') {
        const h = $(`.scene[data-name="${name}"] h1`); h && h.focus({ preventScroll: true });
      }
    }
    function flash() { flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }

    /* ───────── Fullscreen (iPhone only allows it on the <video> itself, and only from a tap) ───────── */
    const inFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement || video.webkitDisplayingFullscreen);
    const canFs = () => !!((document.fullscreenEnabled && cinema.requestFullscreen) || video.webkitEnterFullscreen);
    function enterFs() {
      if (sideways || inFs()) return;
      try {
        if (document.fullscreenEnabled && cinema.requestFullscreen) {
          const p = cinema.requestFullscreen({ navigationUI: 'hide' });
          if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } catch (e) { /* blocked without a tap; the hint takes over */ }
    }
    function exitFs() {
      try {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else if (video.webkitDisplayingFullscreen) video.webkitExitFullscreen();
      } catch (e) {}
      try { screen.orientation.unlock(); } catch (e) {}
    }

    /* ───────── Cinema ───────── */
    function showHud(sticky) {
      cinema.classList.add('hud-on');
      clearTimeout(hudTimer);
      if (!sticky && !video.paused) hudTimer = setTimeout(() => cinema.classList.remove('hud-on'), 2800);
    }
    function updateHint() {
      let msg = '';
      if (video.paused && !video.ended) msg = 'Tap to play';
      else if (video.muted) msg = sideways || !canFs() ? 'Tap for sound' : 'Tap for sound & full screen';
      else if (!sideways && canFs() && !inFs() && !fsPrompted) msg = 'Tap for full screen';
      hintText.textContent = msg;
      cinema.classList.toggle('has-hint', !!msg);
    }
    const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    function paint() {
      const d = video.duration || 0, t = video.currentTime || 0;
      scrub.style.setProperty('--p', d ? Math.min(1, t / d) : 0);
      $('[data-now]').textContent = fmt(t);
      $('[data-left]').textContent = '-' + fmt(d - t);
    }

    async function startScreening({ restart = false, sideways: forceSideways = false } = {}) {
      const id = ++runId;
      sideways = forceSideways;
      cinema.classList.toggle('is-sideways', sideways);
      cinema.classList.toggle('no-fs', !canFs());
      fsPrompted = false;
      if (restart || video.ended) { try { video.currentTime = 0; } catch (e) {} }
      setScene('cinema');
      cinema.hidden = false; void cinema.offsetWidth; cinema.classList.add('on');
      showHud(false);
      video.muted = false;
      enterFs();                                   // first, while any tap is still fresh
      try { await video.play(); }
      catch (e) {
        video.muted = true;                        // browser wouldn't allow sound without a tap
        try { await video.play(); } catch (e2) {}
      }
      if (id !== runId) return;
      paint();
      setTimeout(() => { if (id === runId) updateHint(); }, 400);
    }

    function leaveCinema(next) {
      runId++;
      video.pause();
      exitFs();
      cinema.classList.remove('on', 'has-hint', 'hud-on');
      setTimeout(() => { if (state !== 'cinema') cinema.hidden = true; }, 340);
      setScene(next);
    }
    function finish() { flash(); leaveCinema('gift'); }

    /* Warm the video up on the first tap so it can start itself the moment she rotates. */
    function prime() {
      try { video.currentTime = 0; } catch (e) {}
      video.muted = true;
      const p = video.play();
      if (p && p.then) p.then(() => { if (state !== 'cinema') { video.pause(); try { video.currentTime = 0; } catch (e) {} } }).catch(() => {});
    }

    function begin() {
      flash();
      video.preload = 'auto';
      if (!needsRotate()) { startScreening({ restart: true }); return; }   // already sideways: go straight in
      prime();
      $('[data-emblem-sealed]').classList.add('lit');
      setTimeout(() => setScene('rotate'), 320);
    }

    function onOrientation() {
      clearTimeout(orientTimer);
      orientTimer = setTimeout(() => {
        if (state === 'rotate' && isLandscape()) startScreening();
        else if (state === 'cinema' && sideways && isLandscape()) {      // she unlocked and really rotated
          sideways = false; cinema.classList.remove('is-sideways'); cinema.classList.toggle('no-fs', !canFs());
        } else if (state === 'cinema' && !sideways && !inFs() && needsRotate()) {
          runId++; video.pause();                                         // turned back upright: pause and ask again
          cinema.classList.remove('on', 'has-hint');
          setTimeout(() => { if (state !== 'cinema') cinema.hidden = true; }, 340);
          setScene('rotate');
        }
      }, 60);
    }
    landscapeQuery.addEventListener('change', onOrientation);
    try { screen.orientation.addEventListener('change', onOrientation); } catch (e) {}

    /* ───────── Wiring ───────── */
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const a = btn.dataset.action;
      if (a === 'open' || a === 'replay') begin();
      else if (a === 'sideways') startScreening({ restart: true, sideways: true });
      else if (a === 'skip') finish();
      else if (a === 'toggle') { video.paused ? video.play().catch(() => {}) : video.pause(); }
      else if (a === 'fullscreen') { inFs() ? exitFs() : enterFs(); }
    });

    // Any tap on the picture: sound on, play if paused, and the first tap goes full screen.
    cinema.addEventListener('click', e => {
      if (e.target.closest('button, .scrub')) return;
      if (video.muted) video.muted = false;
      if (video.paused) video.play().catch(() => {});
      if (!fsPrompted && !sideways && canFs() && !inFs()) { fsPrompted = true; enterFs(); }
      else showHud(false);
      updateHint();
    });

    // Scrubbing (handles the sideways layout too)
    let dragging = false;
    function seek(e) {
      const r = scrub.getBoundingClientRect();
      const f = sideways ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
      if (video.duration) video.currentTime = Math.min(1, Math.max(0, f)) * video.duration;
      paint(); showHud(false);
    }
    scrub.addEventListener('pointerdown', e => { dragging = true; scrub.setPointerCapture(e.pointerId); seek(e); });
    scrub.addEventListener('pointermove', e => { if (dragging) seek(e); });
    ['pointerup', 'pointercancel'].forEach(t => scrub.addEventListener(t, () => { dragging = false; }));

    video.addEventListener('timeupdate', paint);
    video.addEventListener('loadedmetadata', paint);
    video.addEventListener('play', () => { cinema.classList.remove('is-paused'); showHud(false); updateHint(); });
    video.addEventListener('pause', () => { if (state === 'cinema') { cinema.classList.add('is-paused'); showHud(true); updateHint(); } });
    video.addEventListener('volumechange', updateHint);
    video.addEventListener('ended', () => { if (state === 'cinema') finish(); });
    ['fullscreenchange', 'webkitbeginfullscreen', 'webkitendfullscreen', 'webkitfullscreenchange'].forEach(t => {
      (t.startsWith('webkitbegin') || t.startsWith('webkitend') ? video : document).addEventListener(t, () => {
        if (inFs()) { fsPrompted = true; }
        updateHint();
      });
    });
    video.addEventListener('error', () => { if (state === 'cinema') { hintText.textContent = 'Trailer couldn’t load. Tap skip to open your gift.'; cinema.classList.add('has-hint'); } });
    addEventListener('keydown', e => {
      if (state !== 'cinema') return;
      if (e.code === 'Space') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
      if (e.key === 'f') inFs() ? exitFs() : enterFs();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) ash.stop(); else if (state !== 'cinema') ash.start();
    });

    /* ───────── Boot ───────── */
    document.querySelectorAll('[data-split]').forEach(el => {
      const text = el.textContent.trim(); el.setAttribute('aria-label', text); el.textContent = '';
      let i = 0;
      text.split(' ').forEach((word, wi, words) => {
        const w = document.createElement('span'); w.className = 'w'; w.setAttribute('aria-hidden', 'true');
        [...word].forEach(ch => { const c = document.createElement('span'); c.className = 'c'; c.style.setProperty('--i', i++); c.textContent = ch; w.append(c); });
        el.append(w); if (wi < words.length - 1) el.append(' ');
      });
    });
    ash.init(); ash.start();
    const cta = $('[data-action="open"]');
    cta.hidden = false;
    setTimeout(() => cta.classList.add('ready'), 2300);
  })();
  </script>
</body>
</html>
